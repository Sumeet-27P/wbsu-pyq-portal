<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBSU Academic Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="top-nav">
        <div class="logo-box">
            <h1>WBSU <span class="portal-badge">ACADEMIC PORTAL</span></h1>
        </div>
        <div class="search-box">
            <input type="text" placeholder="Search subjects, years, topics...">
            <span>🔍</span>
        </div>
    </header>

    <!-- Main Header -->
    <div class="page-title">
        <h2>CHOOSE YOUR SUBJECT</h2>
        <p>Select your program to access previous year papers and resources.</p>
    </div>

    <!-- Interactive Grid -->
    <div class="grid-container">
        
        <!-- Computer Science Card (Active Link) -->
        <a href="cs-semesters.html" class="card cs-card">
            <div class="card-top">
                <span class="tag">(Hons)</span>
                <span class="icon">&lt;/&gt;</span>
            </div>
            <h3>COMPUTER SCIENCE</h3>
            <p>Algorithms, Programming, Systems.</p>
            <button class="btn-explore">Explore</button>
        </a>

        <!-- Mathematics Card (Dead Link for now) -->
        <a href="math-semesters.html" class="card math-card">            <div class="card-top">
                <span class="tag">(Gen)</span>
                <span class="icon">π</span>
            </div>
            <h3>MATHEMATICS</h3>
            <p>Calculus, Algebra, Statistics.</p>
            <button class="btn-explore">Explore</button>
        </a>

        <!-- Physics Card (Dead Link for now) -->
        <a href="phy-semesters.html" class="card phy-card">
            <div class="card-top">
                <span class="tag">(Gen)</span>
                <span class="icon">⚛️</span>
            </div>
            <h3>PHYSICS</h3>
            <p>Theories, Optics, Experiments.</p>
            <button class="btn-explore">Explore</button>
        </a>

    </div>

</body>
</html>
